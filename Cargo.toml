[workspace]
members = [
    "programs/vcoin-token",
    "programs/vevcoin-token",
    "programs/staking-protocol",
    "programs/transfer-hook",
    "programs/identity-protocol",
    "programs/five-a-protocol",
    "programs/content-registry",
    "programs/governance-protocol",
    "programs/sscre-protocol",
    "programs/vilink-protocol",
    "programs/gasless-protocol",
    "crates/vcoin-common",
    "integration-tests",
]
resolver = "2"

# Single pinned toolchain for every program and test crate.
[workspace.dependencies]
anchor-lang = { version = "=0.32.1" }
anchor-spl = { version = "=0.32.1" }
litesvm = "0.7.1"
solana-sdk = "2.3"
vcoin-common = { path = "crates/vcoin-common" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
