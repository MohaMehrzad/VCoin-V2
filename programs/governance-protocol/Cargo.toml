[package]
name = "governance-protocol"
version = "0.1.0"
description = "ViWoApp Governance Protocol - veVCoin voting with 5A boost and ZK private voting"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "governance_protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true, features = ["token_2022", "token_2022_extensions"] }
solana-sha256-hasher = "2"
solana-hash = "2"
solana-curve25519 = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
