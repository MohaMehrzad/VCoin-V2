[package]
name = "content-registry"
version = "0.1.0"
description = "ViWoApp Content Registry - On-chain content tracking with energy system"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "content_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "vcoin-common/idl-build", "staking-protocol/idl-build", "gasless-protocol/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
vcoin-common = { workspace = true }
staking-protocol = { path = "../staking-protocol", features = ["no-entrypoint"] }
gasless-protocol = { path = "../gasless-protocol", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
