[package]
name = "sscre-protocol"
version = "0.1.0"
description = "SSCRE Rewards Protocol - Self-Sustaining Circular Reward Economy"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sscre_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true, features = ["token_2022", "token_2022_extensions"] }
solana-program = "2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
