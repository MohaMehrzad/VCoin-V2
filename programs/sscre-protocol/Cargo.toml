[package]
name = "sscre-protocol"
version = "0.1.0"
description = "SSCRE rewards: per-epoch merkle distributor funded from a reserve on a declining emission schedule, roots approved by an oracle quorum with a dispute delay and DAO veto, unclaimed funds clawed back"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sscre_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "vcoin-common/idl-build", "vcoin-token/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true, features = ["token_2022", "token_2022_extensions"] }
vcoin-common = { workspace = true }
vcoin-token = { path = "../vcoin-token", features = ["no-entrypoint"] }
solana-keccak-hasher = "2.2"

[dev-dependencies]
sha3 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
