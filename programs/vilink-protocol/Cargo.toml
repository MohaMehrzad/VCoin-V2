[package]
name = "vilink-protocol"
version = "0.1.0"
description = "ViLink Protocol - Cross-dApp Action Deep Links"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vilink_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "vcoin-common/idl-build", "vcoin-token/idl-build", "gasless-protocol/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true, features = ["token_2022", "token_2022_extensions"] }
vcoin-common = { workspace = true }
vcoin-token = { path = "../vcoin-token", features = ["no-entrypoint"] }
gasless-protocol = { path = "../gasless-protocol", features = ["no-entrypoint"] }
solana-sha256-hasher = "2.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
