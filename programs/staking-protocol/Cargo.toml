[package]
name = "staking-protocol"
version = "0.1.0"
description = "VCoin Staking Protocol with Tier System and veVCoin Minting"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "staking_protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true, features = ["token_2022", "token_2022_extensions"] }
vcoin-token = { path = "../vcoin-token", features = ["cpi"] }
vevcoin-token = { path = "../vevcoin-token", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

