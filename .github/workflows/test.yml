# ViWo protocol CI
#
# Every job is blocking: no `|| true`, no `continue-on-error`.
#   rust  - fmt, clippy (-D warnings), anchor build (IDL on, stack-frame guard), cargo test
#   sdk   - typecheck, unit tests and build of @viwoapp/sdk
#   audit - RustSec advisory scan of Cargo.lock

name: CI

on:
  push:
    branches: [main, develop, audit-remediation]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AGAVE_VERSION: "3.0.13"
  ANCHOR_VERSION: "0.32.0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the channel (1.89.0) and components from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          target: wasm32-unknown-unknown

      - name: Install Agave (Solana) CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install "${ANCHOR_VERSION}"
          avm use "${ANCHOR_VERSION}"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Anchor build (IDL on) with stack-frame guard
        run: |
          anchor build 2>&1 | tee anchor-build.log
          if grep -q "Stack offset" anchor-build.log; then
            echo "::error::An SBF function exceeds the 4096-byte stack frame (see log)"
            exit 1
          fi

      - name: Tests (unit + LiteSVM integration)
        run: cargo test --workspace

      - name: ZK SDK wasm build (TypeScript bindings)
        run: cargo check -p zk-voting-sdk --features wasm --target wasm32-unknown-unknown

      - name: Upload program binaries and IDLs for the SDK job
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build
          path: |
            target/deploy/*.so
            target/idl/*.json
            target/types/*.ts

  sdk:
    name: TypeScript SDK
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: anchor-build
          path: target
      - name: Committed IDLs and API reference match the programs
        run: |
          node scripts/sync-idl.mjs && git diff --exit-code packages/viwoapp-sdk/src/idl
          node scripts/gen-api-docs.mjs && git diff --exit-code docs/API.md
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/viwoapp-sdk/package-lock.json
      - name: Install, typecheck, lint, test (unit + litesvm end-to-end), build, smoke
        working-directory: packages/viwoapp-sdk
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run smoke

  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    # Plain `cargo audit` (same command as the local gate). The previous third-party action
    # needed `checks: write` to post a check run and failed with the read-only token.
    # Vulnerabilities fail the job; informational warnings (unmaintained/unsound, all in
    # Solana/Anchor host tooling) are printed but do not. Ignores live in .cargo/audit.toml.
    permissions:
      contents: read
    env:
      CARGO_AUDIT_VERSION: "0.23.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
      - name: cargo audit
        run: cargo audit
